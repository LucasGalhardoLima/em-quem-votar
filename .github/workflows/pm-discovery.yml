name: PM Discovery Backlog

on:
  schedule:
    # 08:00 BRT (11:00 UTC), daily
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run PM Discovery Agent
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          LINEAR_PROJECT_NAME: Em Quem Votar - Product Discovery
          LINEAR_DIGEST_TITLE: Discovery Daily Digest
          PM_DISCOVERY_DAILY_LIMIT: "5"
          PM_DISCOVERY_WEEKLY_LIMIT: "20"
        run: npm run pm:discovery

      - name: Summary
        run: echo "PM Discovery completed at $(date)"
